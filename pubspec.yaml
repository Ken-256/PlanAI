name: plan_ai
description: A smart AI-powered personal planner and social scheduler.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  get_it: ^7.6.4
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  table_calendar: ^3.0.9
  
  # Authentication & Database
  supabase_flutter: ^2.0.0
  flutter_secure_storage: ^9.0.0
  
  # HTTP & API
  dio: ^5.4.0
  json_annotation: ^4.8.1
  
  # Utilities
  intl: ^0.18.1
  timezone: ^0.9.2
  uuid: ^4.2.2
  logger: ^2.0.2
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.8
  freezed: ^2.5.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/ 